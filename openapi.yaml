openapi: 3.1.0
info:
  title: Parento Backend API
  version: 1.0.0
  description: |
    API foundation for Parento. This document describes implemented
    operational endpoints and shared response/error contracts only.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHealth'
    head:
      summary: Backend health headers
      operationId: headHealth
      responses:
        '200':
          description: Service is responding
    options:
      summary: Health CORS preflight
      operationId: optionsHealth
      responses:
        '204':
          description: CORS preflight accepted
        '403':
          description: Origin not allowed
    post:
      summary: Method not allowed
      operationId: postHealthNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/ready:
    get:
      summary: Backend readiness check
      operationId: getReady
      responses:
        '200':
          description: Service is ready to accept normal traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReady'
    post:
      summary: Method not allowed
      operationId: postReadyNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  schemas:
    ApiSuccessHealth:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ok }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccessReady:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ready }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccess:
      type: object
      required: [success, data, requestId]
      properties:
        success: { type: boolean, const: true }
        data: {}
        requestId: { type: string }
    ApiError:
      type: object
      required: [success, error, requestId]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
                - AUTHORIZATION_DENIED
                - INVALID_REQUEST
                - RESOURCE_NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - METHOD_NOT_ALLOWED
                - REQUEST_TOO_LARGE
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
                - NOT_FOUND
            message:
              type: string
            metadata:
              type: object
        requestId:
          type: string
  responses:
    MethodNotAllowed:
      description: HTTP method is not supported for the endpoint
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
