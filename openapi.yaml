openapi: 3.1.0
info:
  title: Parento Backend API
  version: 1.0.0
  description: |
    API foundation for Parento. This document includes administrator authentication,
    Phase 5 enrollment, and the Phase 6.1 secure device communication/command foundation.
    Phase 6.1 exposes only the neutral FUTURE_COMMAND envelope; no device-control capability is implemented.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHealth'
    head:
      summary: Backend health headers
      operationId: headHealth
      responses:
        '200':
          description: Service is responding
    options:
      summary: Health CORS preflight
      operationId: optionsHealth
      responses:
        '204':
          description: CORS preflight accepted
        '403':
          description: Origin not allowed
    post:
      summary: Method not allowed
      operationId: postHealthNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/auth/admin/login:
    post:
      summary: Authenticate an administrator
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authenticated administrator and opaque session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Invalid request shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid administrator credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/refresh:
    post:
      summary: Rotate administrator access and refresh credentials
      operationId: adminRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshRequest'
      responses:
        '200':
          description: Rotated opaque session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenResponse'
        '400':
          description: Invalid request shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid or expired refresh credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Authentication rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/me:
    get:
      summary: Get the authenticated administrator identity
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated administrator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIdentityResponse'
        '401':
          description: Missing or invalid access credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/logout:
    post:
      summary: Revoke the current administrator session
      operationId: adminLogout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Missing or invalid access credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/ready:
    get:
      summary: Backend readiness check
      operationId: getReady
      responses:
        '200':
          description: Service is ready to accept normal traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReady'
    post:
      summary: Method not allowed
      operationId: postReadyNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/devices/enrollments:
    post:
      summary: Create an enrollment session
      operationId: createEnrollment
      security:
        - bearerAuth: []
      requestBody:
        required: false
      responses:
        '201':
          description: Enrollment session and one-time authorization secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreateResponse'
        '401':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/ApiErrorResponse'
    get:
      summary: List enrollment sessions owned by the administrator
      operationId: listEnrollments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        '401':
          $ref: '#/components/responses/ApiErrorResponse'
  /api/v1/devices/enrollments/{enrollmentId}:
    get:
      summary: Get an owned enrollment session
      operationId: getEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Enrollment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentStatusResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
        '410':
          $ref: '#/components/responses/ApiErrorResponse'
    post:
      summary: Method not allowed
      operationId: postEnrollmentNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/devices/enrollments/{enrollmentId}/cancel:
    post:
      summary: Cancel an active owned enrollment session
      operationId: cancelEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Cancelled enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentStatusResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/ApiErrorResponse'
        '410':
          $ref: '#/components/responses/ApiErrorResponse'
  /api/v1/devices/enrollments/{enrollmentId}/consume:
    post:
      summary: Consume enrollment authorization and associate a managed Android installation
      operationId: consumeEnrollment
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentConsumeRequest'
      responses:
        '200':
          description: Completed enrollment and managed-device identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentConsumeResponse'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
        '401':
          $ref: '#/components/responses/ApiErrorResponse'
        '403':
          $ref: '#/components/responses/ApiErrorResponse'
        '404':
          $ref: '#/components/responses/ApiErrorResponse'
        '409':
          $ref: '#/components/responses/ApiErrorResponse'
        '410':
          $ref: '#/components/responses/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/ApiErrorResponse'
  /api/v1/devices/{deviceId}/commands:
    post:
      summary: Create an allowlisted command envelope for an owned device
      operationId: createDeviceCommand
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, version, payload]
              properties:
                type: { type: string, enum: [FUTURE_COMMAND] }
                version: { type: integer, enum: [1] }
                payload: { type: object, additionalProperties: false, maxProperties: 0 }
                idempotencyKey: { type: string, maxLength: 128, nullable: true }
                correlationId: { type: string, maxLength: 128, nullable: true }
      responses:
        '201': { description: Command created }
        '200': { description: Existing command returned for an idempotent retry }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '404': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/devices/{deviceId}/commands/{commandId}:
    get:
      summary: Get an owned command
      operationId: getDeviceCommand
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Command status }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '404': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/devices/{deviceId}/commands/{commandId}/cancel:
    post:
      summary: Cancel a non-terminal command
      operationId: cancelDeviceCommand
      security: [{ bearerAuth: [] }]
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cancelled command }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/sessions:
    post:
      summary: Establish a managed-device communication session
      operationId: createDeviceSession
      security: []
      responses:
        '201':
          description: Device session and short-lived session token
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/sessions/heartbeat:
    post:
      summary: Refresh an authenticated device session
      operationId: heartbeatDeviceSession
      security: [{ deviceSessionBearer: [] }]
      responses:
        '200': { description: Refreshed device session }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/sessions/disconnect:
    post:
      summary: Disconnect an authenticated device session
      operationId: disconnectDeviceSession
      security: [{ deviceSessionBearer: [] }]
      responses:
        '200': { description: Disconnected device session }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/commands/{commandId}/ack:
    post:
      summary: Acknowledge command delivery
      operationId: acknowledgeDeviceCommand
      security: [{ deviceSessionBearer: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Acknowledged command }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/commands/{commandId}/start:
    post:
      summary: Mark an acknowledged command as running
      operationId: startDeviceCommand
      security: [{ deviceSessionBearer: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Running command }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /api/v1/device/commands/{commandId}/result:
    post:
      summary: Report a structured command result
      operationId: reportDeviceCommandResult
      security: [{ deviceSessionBearer: [] }]
      parameters:
        - name: commandId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [SUCCEEDED, FAILED] }
                resultCode: { type: string, maxLength: 100, nullable: true }
                errorCategory: { type: string, maxLength: 100, nullable: true }
                resultMetadata: { type: object, nullable: true }
      responses:
        '200': { description: Command result recorded }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '401': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    deviceSessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ApiSuccessHealth:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ok }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccessReady:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ready }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccess:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    AdminLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 15
          maxLength: 256
    AdminRefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 256
    AdminIdentity:
      type: object
      required: [id, email, status, lastAuthenticatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        lastAuthenticatedAt:
          type: string
          format: date-time
          nullable: true
    AdminIdentityResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [admin]
              properties:
                admin:
                  $ref: '#/components/schemas/AdminIdentity'
    AdminTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  accessToken,
                  refreshToken,
                  accessTokenExpiresAt,
                  sessionExpiresAt,
                  tokenType,
                ]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                accessTokenExpiresAt: { type: string, format: date-time }
                sessionExpiresAt: { type: string, format: date-time }
                tokenType: { type: string, enum: [Bearer] }
    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required:
                [
                  admin,
                  accessToken,
                  refreshToken,
                  accessTokenExpiresAt,
                  sessionExpiresAt,
                  tokenType,
                ]
              properties:
                admin:
                  $ref: '#/components/schemas/AdminIdentity'
                accessToken: { type: string }
                refreshToken: { type: string }
                accessTokenExpiresAt: { type: string, format: date-time }
                sessionExpiresAt: { type: string, format: date-time }
                tokenType: { type: string, enum: [Bearer] }
    EnrollmentStatus:
      type: string
      enum:
        [
          CREATED,
          PENDING,
          VERIFIED,
          COMPLETED,
          EXPIRED,
          CANCELLED,
          REVOKED,
          FAILED,
        ]
    Enrollment:
      type: object
      required:
        [
          id,
          status,
          createdAt,
          updatedAt,
          expiresAt,
          verifiedAt,
          completedAt,
          cancelledAt,
          managedDeviceId,
          verificationAttempts,
        ]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        managedDeviceId: { type: string, format: uuid, nullable: true }
        verificationAttempts: { type: integer, minimum: 0 }
    EnrollmentCreateResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [enrollment, authorizationSecret]
              properties:
                enrollment: { $ref: '#/components/schemas/Enrollment' }
                authorizationSecret:
                  { type: string, minLength: 43, maxLength: 43 }
    EnrollmentListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [enrollments]
              properties:
                enrollments:
                  type: array
                  items: { $ref: '#/components/schemas/Enrollment' }
    EnrollmentStatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [enrollment]
              properties:
                enrollment: { $ref: '#/components/schemas/Enrollment' }
    EnrollmentConsumeRequest:
      type: object
      additionalProperties: false
      required: [authorizationSecret, localInstallationIdentity, name, platform]
      properties:
        authorizationSecret:
          type: string
          minLength: 43
          maxLength: 43
        localInstallationIdentity:
          type: string
          minLength: 8
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          type: string
          enum: [android]
    EnrollmentConsumeResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [enrollment, managedDeviceId]
              properties:
                enrollment: { $ref: '#/components/schemas/Enrollment' }
                managedDeviceId: { type: string, format: uuid }
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
                - INVALID_REQUEST
                - INVALID_CREDENTIALS
                - AUTHORIZATION_DENIED
                - RESOURCE_NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - METHOD_NOT_ALLOWED
                - REQUEST_TOO_LARGE
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
                - DATABASE_UNAVAILABLE
                - NOT_FOUND
                - ENROLLMENT_NOT_FOUND
                - ENROLLMENT_EXPIRED
                - ENROLLMENT_ALREADY_CONSUMED
                - ENROLLMENT_STATE_CONFLICT
                - INVALID_ENROLLMENT_VERIFICATION
                - DEVICE_IDENTITY_CONFLICT
            message:
              type: string
            metadata:
              type: object
        requestId:
          type: string
  parameters:
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ApiErrorResponse:
      description: API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    MethodNotAllowed:
      description: HTTP method is not supported for the endpoint
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
