openapi: 3.1.0
info:
  title: Parento Backend API
  version: 1.0.0
  description: |
    API foundation for Parento. This document describes implemented operational
    and Phase 3.1 administrator authentication endpoints and shared contracts.
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Backend health check
      operationId: getHealth
      responses:
        '200':
          description: Service is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessHealth'
    head:
      summary: Backend health headers
      operationId: headHealth
      responses:
        '200':
          description: Service is responding
    options:
      summary: Health CORS preflight
      operationId: optionsHealth
      responses:
        '204':
          description: CORS preflight accepted
        '403':
          description: Origin not allowed
    post:
      summary: Method not allowed
      operationId: postHealthNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/auth/admin/login:
    post:
      summary: Authenticate an administrator
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Authenticated administrator and opaque session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLoginResponse'
        '400':
          description: Invalid request shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid administrator credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/refresh:
    post:
      summary: Rotate administrator access and refresh credentials
      operationId: adminRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRefreshRequest'
      responses:
        '200':
          description: Rotated opaque session credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTokenResponse'
        '400':
          description: Invalid request shape
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Invalid or expired refresh credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/me:
    get:
      summary: Get the authenticated administrator identity
      operationId: getCurrentAdmin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated administrator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminIdentityResponse'
        '401':
          description: Missing or invalid access credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/auth/admin/logout:
    post:
      summary: Revoke the current administrator session
      operationId: adminLogout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Missing or invalid access credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/ready:
    get:
      summary: Backend readiness check
      operationId: getReady
      responses:
        '200':
          description: Service is ready to accept normal traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccessReady'
    post:
      summary: Method not allowed
      operationId: postReadyNotAllowed
      responses:
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    ApiSuccessHealth:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ok }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccessReady:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [status, service, version]
              properties:
                status: { type: string, example: ready }
                service: { type: string, example: parento-backend }
                version: { type: string, example: '1' }
    ApiSuccess:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: { type: string }
    AdminLoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    AdminRefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 20
          maxLength: 256
    AdminIdentity:
      type: object
      required: [id, email, status, lastAuthenticatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        lastAuthenticatedAt:
          type: string
          format: date-time
          nullable: true
    AdminIdentityResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [admin]
              properties:
                admin:
                  $ref: '#/components/schemas/AdminIdentity'
    AdminTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [accessToken, refreshToken, accessTokenExpiresAt, sessionExpiresAt, tokenType]
              properties:
                accessToken: { type: string }
                refreshToken: { type: string }
                accessTokenExpiresAt: { type: string, format: date-time }
                sessionExpiresAt: { type: string, format: date-time }
                tokenType: { type: string, enum: [Bearer] }
    AdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          properties:
            data:
              type: object
              required: [admin, accessToken, refreshToken, accessTokenExpiresAt, sessionExpiresAt, tokenType]
              properties:
                admin:
                  $ref: '#/components/schemas/AdminIdentity'
                accessToken: { type: string }
                refreshToken: { type: string }
                accessTokenExpiresAt: { type: string, format: date-time }
                sessionExpiresAt: { type: string, format: date-time }
                tokenType: { type: string, enum: [Bearer] }
    ApiError:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
                - AUTHORIZATION_DENIED
                - INVALID_REQUEST
                - RESOURCE_NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - METHOD_NOT_ALLOWED
                - REQUEST_TOO_LARGE
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
                - NOT_FOUND
            message:
              type: string
            metadata:
              type: object
        requestId:
          type: string
  responses:
    MethodNotAllowed:
      description: HTTP method is not supported for the endpoint
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
