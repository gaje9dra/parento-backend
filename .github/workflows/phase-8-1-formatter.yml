name: Phase 8.1 Formatter

on:
  push:
    branches:
      - phase-8.1-location-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase-8.1-location-foundation
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install

      - name: Format Phase 8.1 files
        run: |
          npx prettier --write .

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/location.ts src/repositories/location-repository.ts src/repositories/postgres-location-repository.ts src/services/location-service.ts src/controllers/location.controller.ts src/routes/v1/location.routes.ts tests/location-service.test.ts migrations/0009_phase_8_1_location_foundation.sql docs/phase-8.1-location-foundation.md openapi.yaml src/routes/v1/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(phase-8.1): format implementation"
          git push origin phase-8.1-location-foundation
