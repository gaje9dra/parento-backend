name: Phase 6.4 Typecheck Diagnostic

on:
  push:
    branches:
      - phase-6-4-backend-device-communication-monitoring

permissions:
  contents: write

jobs:
  typecheck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install

      - name: Capture typecheck diagnostics
        run: |
          set +e
          npm run typecheck > typecheck-diagnostics.txt 2>&1
          status=$?
          echo "TYPECHECK_EXIT_CODE=$status" >> typecheck-diagnostics.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-diagnostics.txt
          git commit -m "chore(phase-6.4): capture typecheck diagnostics"
          git push origin "HEAD:${{ github.ref_name }}"
