name: Temporary Prettier Helper

on:
  push:
    branches: [phase-10.1-audio-access-foundation]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install --ignore-scripts
      - run: npx prettier --write openapi.yaml src/config/env.ts src/controllers/audio-access.controller.ts src/repositories/postgres-audio-access-session-repository.ts src/services/audio-access-service.ts src/services/command-service.ts tests/audio-access-domain.test.ts tests/audio-access-service.test.ts tests/command-service.test.ts
      - run: git diff -- openapi.yaml src/config/env.ts src/controllers/audio-access.controller.ts src/repositories/postgres-audio-access-session-repository.ts src/services/audio-access-service.ts src/services/command-service.ts tests/audio-access-domain.test.ts tests/audio-access-service.test.ts tests/command-service.test.ts
