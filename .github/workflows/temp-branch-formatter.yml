name: Temporary Branch Formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: git fetch origin phase-6-1-device-communication
      - run: git checkout phase-6-1-device-communication
      - run: npm install --ignore-scripts
      - run: npx prettier --write .
      - name: Commit formatted branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(phase-6.1): format backend changes"
          git push origin phase-6-1-device-communication
