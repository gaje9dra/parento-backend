name: Backend Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Format diagnostics
        run: |
          npx prettier --write .
          mkdir -p formatted
          git diff --name-only | while read -r file; do
            mkdir -p "formatted/$(dirname "$file")"
            cp "$file" "formatted/$file"
          done

      - name: Upload formatted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: formatted

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit
