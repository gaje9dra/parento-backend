name: Backend Verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Format and commit
        run: |
          npx prettier --write .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format backend"
          git push

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check diagnostics
        run: npm run typecheck > typecheck.txt 2>&1 || true

      - name: Upload type check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-output
          path: typecheck.txt

      - name: Type check
        run: npm run typecheck

      - name: Unit and API tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit
