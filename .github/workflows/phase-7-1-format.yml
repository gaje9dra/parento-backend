name: Temporary Phase 7.1 Formatter

on:
  push:
    branches: [phase-7-1-device-monitoring-expansion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install
      - run: npx prettier --write src/repositories/device-monitoring-repository.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/repositories/device-monitoring-repository.ts
          git diff --cached --quiet || git commit -m "chore: format monitoring query types"
          git push
