name: Phase 12.1 temporary formatter
on:
  push:
    branches:
      - phase-12.1-network-policy-foundation
permissions:
  contents: write
jobs:
  format:
    if: !startsWith(github.event.head_commit.message, 'chore(phase-12.1): format generated files')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm install
      - run: npx prettier --write .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore(phase-12.1): format generated files"
          git push
