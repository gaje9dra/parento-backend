name: Phase 9.1 Temporary Formatter

on:
  push:
    branches: [phase-9.1-screen-sharing-foundation]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[prettier]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
      - name: Format Phase 9.1 files
        shell: bash
        run: |
          files="$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|md|json|yml|yaml)$|^\.env\.example$' || true)"
          files="$files"$'\n'"src/repositories/postgres-device-monitoring-repository.ts"
          printf '%s\n' "$files" | sed '/^$/d' | xargs npx prettier --write
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format Phase 9.1 files [prettier]"
          git push
