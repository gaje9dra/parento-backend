name: Phase 9.1 Temporary Formatter

on:
  push:
    branches: [phase-9.1-screen-sharing-foundation]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[prettier]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/domain/device-monitoring.ts src/repositories/device-monitoring-repository.ts src/services/device-monitoring-service.ts src/services/screen-sharing-service.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format Phase 9.1 files [prettier]"
          git push
