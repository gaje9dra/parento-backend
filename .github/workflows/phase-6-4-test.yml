name: Phase 6.4 Test Diagnostic

on:
  push:
    branches:
      - phase-6-4-backend-device-communication-monitoring

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: parento_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parento_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/parento_test
      DATABASE_SSL: false
      LOG_PRETTY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: npm install

      - name: Migrate database
        run: npm run db:migrate

      - name: Capture test diagnostics
        run: |
          set +e
          npm test > test-diagnostics.txt 2>&1
          status=$?
          echo "TEST_EXIT_CODE=$status" >> test-diagnostics.txt
          exit 0

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-diagnostics.txt
          git commit -m "chore(phase-6.4): capture test diagnostics"
          git push origin "HEAD:${{ github.ref_name }}"
